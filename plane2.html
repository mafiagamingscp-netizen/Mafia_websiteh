<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة Crash - الطيارة فوق المضاعف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary-color: #ff8c00;
    --secondary-color: #2c3e50;
    --background-color: #000000;
    --text-color: #ffffff;
    --graph-bg: #000000;
    --winner-color: #27ae60;
    --loser-color: #c0392b;
    --border-radius: 8px;
    --padding-unit: 10px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Cairo',sans-serif; background-color: var(--background-color); color: var(--text-color); direction: rtl; padding: var(--padding-unit);}
.top-bar { display:flex; justify-content:space-between; align-items:center; padding: var(--padding-unit); background-color: var(--secondary-color); border-radius: var(--border-radius); margin-bottom: var(--padding-unit); font-size:1.1em;}
.balance span { background-color:#ff007f; padding:2px 6px; border-radius:4px; font-size:0.8em; font-weight:bold;}
.actions { display:flex; align-items:center; }
.actions .value { margin:0 5px; font-weight:bold; }
.actions button.add-balance { background-color: var(--primary-color); color: var(--text-color); border:none; border-radius:50%; width:28px; height:28px; font-size:1.2em; cursor:pointer; margin:0 5px; line-height:1;}
.arrow-right { font-size:1.5em; margin-right:5px; opacity:0.7;}
.game-area { background-color: var(--background-color); padding: var(--padding-unit); border-radius: var(--border-radius);}
.graph-container { height:200px; background-color: var(--graph-bg); border-radius: var(--border-radius); margin-bottom: var(--padding-unit); position:relative; overflow:hidden;}
.multiplier { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3em; font-weight:bold; color: var(--text-color); text-shadow:0 0 10px rgba(0,0,0,0.5); z-index:10; }
.bet-controls { display:flex; gap: var(--padding-unit); margin-bottom: var(--padding-unit);}
.control-box { flex:1; background-color: var(--graph-bg); padding: var(--padding-unit); border-radius: var(--border-radius); text-align:center;}
.auto-toggle button { width:100%; padding: var(--padding-unit); margin-bottom: var(--padding-unit); background-color:#e67e22; color: var(--text-color); border:none; border-radius:4px; cursor:pointer;}
.bet-input-section { display:flex; gap:5px; margin-bottom: var(--padding-unit);}
.bet-input-section input { flex-grow:1; text-align:center; padding:8px; border:none; border-radius:4px; background-color:#34495e; color: var(--text-color);}
.bet-input-section button.auto-cashout { background-color:#c0392b; color: var(--text-color); border:none; border-radius:4px; padding:8px 12px; cursor:pointer;}
.bet-amounts { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-bottom: var(--padding-unit);}
.bet-amounts button { background-color:#34495e; color: var(--text-color); border:none; padding:8px; border-radius:4px; cursor:pointer;}
.place-bet { width:100%; padding: var(--padding-unit); background-color: var(--primary-color); color: var(--text-color); font-weight:bold; border:none; border-radius:4px; cursor:pointer;}
.stats-bar { display:flex; justify-content:space-around; align-items:center; background-color:#e67e22; padding: var(--padding-unit) 0; border-radius: var(--border-radius); margin-bottom: var(--padding-unit); text-align:center;}
.stat-item span { font-weight:bold; font-size:1.1em;}
.user-bets-table { background-color: var(--graph-bg); border-radius: var(--border-radius); overflow:hidden; padding: var(--padding-unit); max-height:300px; overflow-y:auto;}
.table-header, .table-row { display:grid; grid-template-columns:repeat(4,1fr); padding:8px 0; text-align:center; font-size:0.9em;}
.table-header { font-weight:bold; background-color: var(--secondary-color);}
.table-row { border-top:1px solid #34495e;}
.table-row.winner { background-color: rgba(39,174,96,0.3); color: var(--winner-color);}
.table-row.loser { background-color: rgba(192,57,43,0.3); color: var(--loser-color);}
</style>
</head>
<body>
<header class="top-bar">
    <div class="balance"><span>BONUS</span></div>
    <div class="actions">
        <span class="currency">ج.م</span>
        <span class="value" id="current-balance">0.00</span>
        <button class="add-balance" onclick="window.location.href='edaa.html'">+</button>
        <span class="arrow-right">→</span>
    </div>
</header>

<main class="game-area">
    <div class="graph-container">
        <div class="multiplier" id="current-multiplier">1.00x</div>
    </div>

    <div class="bet-controls">
        <div class="control-box">
            <div class="auto-toggle">
                <button>تمكين التشغيل التلقائي</button>
            </div>
            <div class="bet-input-section">
                <button class="auto-cashout">X</button>
                <input type="text" value="10" placeholder="مضاعف سحب تلقائي">
            </div>
            <div class="bet-amounts">
                <button>90</button><button>30</button><button>10</button>
                <button>3000</button><button>800</button><button>200</button>
            </div>
            <button class="place-bet" data-bet-amount="10">وضع الرهان (10 EGP)</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item total-profit">مجموع الربح<br><span id="total-profit">0.00 EGP</span></div>
        <div class="stat-item total-bets">مجموع الرهانات<br><span id="total-bets">0.00 EGP</span></div>
        <div class="stat-item num-bets">عدد الرهانات<br><span id="num-bets">0</span></div>
    </div>

    <div class="user-bets-table" id="user-bets">
        <div class="table-header">
            <span>الأرباح</span><span>الرهان</span><span>الفرص</span><span>اسم المستخدم</span>
        </div>
    </div>
</main>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ---------------- Firebase Config ----------------
const firebaseConfig = {
    apiKey: "AIzaSyCi-4qjqmDU46Ez5BhV1srVyZ69pM3VzoA",
    authDomain: "crash-7f23b.firebaseapp.com",
    databaseURL: "https://crash-7f23b-default-rtdb.firebaseio.com",
    projectId: "crash-7f23b",
    storageBucket: "crash-7f23b.appspot.com",
    messagingSenderId: "816793973602",
    appId: "1:816793973602:web:9010c6293c04e7066bf23b",
    measurementId: "G-9V844VD20B"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------------- User Init ----------------
let userId = localStorage.getItem('crash_user_id');
if(!userId){
    userId = 'user_' + Date.now();
    localStorage.setItem('crash_user_id', userId);
    db.ref('users/' + userId).set({ balance: 0, name: userId });
}

// ---------------- Game Logic ----------------
let currentBalanceEl = document.getElementById('current-balance');
let currentBalance = 0;
let crashIndex = 0;
let crashPoints = [1.57,1.06,1.18,1.98,8.75,7.68,12.84,6.84,1.72,1.00,1.01,1.02,23.42,9.54,4.67,2.84,3.75,6.51,1.00,1.01,1.85,3.42,4.87,5.51,6.81,7.85,9.24,5.21,31.86,33.72,1.87,1.08,2.89,3.21,6.84,6.85,6.95,1.03,1.01,1.00,1.00,1.00,9.53,4.87,8.07,7.95,12.84,19.51,19.67,17.63,1.85,1.73,1.23,1.54,1.94,2.56,4.82,6.71,11.91,27.67,1.81,3.84,8.17,8.21];

db.ref('users/' + userId).once('value').then(snapshot=>{
    currentBalance = snapshot.val().balance || 0;
    currentBalanceEl.textContent = currentBalance.toFixed(2);
});

function startGame(){
    if(crashIndex >= crashPoints.length) crashIndex = 0;
    let crashPoint = crashPoints[crashIndex++];
    let gameActive = true;
    let currentMultiplier = 1.00;
    const multiplierDisplay = document.getElementById('current-multiplier');
    multiplierDisplay.style.color='var(--text-color)';
    multiplierDisplay.textContent = currentMultiplier.toFixed(2)+'x';

    let intervalId = setInterval(()=>{
        if(currentMultiplier < crashPoint){
            currentMultiplier += 0.01;
            multiplierDisplay.textContent = currentMultiplier.toFixed(2)+'x';
        } else {
            clearInterval(intervalId);
            gameActive=false;
            multiplierDisplay.textContent = currentMultiplier.toFixed(2)+'x';
            multiplierDisplay.style.color='red';
            addRandomUserBets();
            setTimeout(()=>{ startGame(); }, 8000);
        }
    },100);
}

function addRandomUserBets(){
    const users=['Ali***','Mohammed***','Sara***','Hassan***','Layla***','Omar***','Fatma***','Khalid***','Noura***','Youssef***','Mona***','Ahmed***','Aya***','Tamer***','Rania***'];
    const userBetsContainer=document.getElementById('user-bets');
    for(let i=0;i<5;i++){
        const bets=Math.floor(Math.random()*500)+10;
        const profit=Math.random()<0.5?bets*2:0;
        const multiplier=profit>0?(profit/bets).toFixed(2)+'x':'x0';
        const row=document.createElement('div');
        row.className=profit>0?'table-row winner':'table-row loser';
        row.innerHTML=`<span>EGP ${profit}</span><span>EGP ${bets}</span><span>${multiplier}</span><span>${users[Math.floor(Math.random()*users.length)]}</span>`;
        userBetsContainer.appendChild(row);
    }
}

// ---------------- Bet Handling ----------------
document.querySelectorAll('.place-bet').forEach(button=>{
    button.addEventListener('click',()=>{
        const betAmount=parseFloat(button.dataset.betAmount);
        if(currentBalance>=betAmount){
            currentBalance -= betAmount;
            currentBalanceEl.textContent = currentBalance.toFixed(2);
            // Update Firebase
            db.ref('users/' + userId + '/balance').set(currentBalance);
            alert(`تم وضع رهان بمبلغ ${betAmount} EGP.`);
        } else {
            alert('رصيد غير كافي.');
        }
    });
});

window.onload=()=>{ startGame(); };
</script>
</body>
</html>
